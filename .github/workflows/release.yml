name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into info.plist
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import plistlib, sys
          path = "src/info.plist"
          with open(path, "rb") as f:
              data = plistlib.load(f)
          data["version"] = sys.argv[1]
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          EOF

      - name: Build .alfredworkflow
        run: |
          cd src
          zip -r -X "$RUNNER_TEMP/WordWeave.alfredworkflow" . -x ".DS_Store" "*/.DS_Store" "*.pyc" "__pycache__/*"
          unzip -l "$RUNNER_TEMP/WordWeave.alfredworkflow"
          unzip -l "$RUNNER_TEMP/WordWeave.alfredworkflow" | grep -q " info.plist$"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/WordWeave.alfredworkflow" --generate-notes