name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into info.plist
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import plistlib, sys
          path = "src/info.plist"
          with open(path, "rb") as f:
              data = plistlib.load(f)
          data["version"] = sys.argv[1]
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          EOF

      - name: Build .alfredworkflow
        run: |
          cd src
          zip -r ../MyWorkflow.alfredworkflow . -x "*.pyc" "__pycache__/*" ".DS_Store"
          cd ..
          unzip -l MyWorkflow.alfredworkflow | grep -q " info.plist$"   # fail if plist isn't at the root

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MyWorkflow.alfredworkflow --generate-notes